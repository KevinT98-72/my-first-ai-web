<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A little local page with a message that changes at the click of a button.">
    <title>A little change</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #25263b; background: #f6f5f0; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 540px); padding: clamp(28px, 7vw, 56px); background: #fff; border: 1px solid #e6e5df; border-radius: 24px; box-shadow: 0 16px 48px #25263b08; }
      .eyebrow { margin: 0 0 24px; color: #65618a; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(32px, 7vw, 46px); line-height: 1.12; letter-spacing: -.045em; }
      #message { min-height: 3.2em; margin: 24px 0 30px; color: #5b5d70; font-size: 18px; line-height: 1.6; }
      button { border: 0; border-radius: 12px; padding: 15px 22px; background: #5550bf; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #4540a4; }
      button:active { transform: translateY(1px); }
      button:focus-visible { outline: 3px solid #9b96ed; outline-offset: 4px; }
      .hint { margin: 20px 0 0; color: #747585; font-size: 13px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Small interaction. Fresh perspective.</p>
      <h1>A little change.</h1>
      <p id="message" role="status" aria-live="polite" aria-atomic="true">Hello! A new message is just a click away.</p>
      <button id="change-message" type="button">Change the message <span aria-hidden="true">↗</span></button>
      <p class="hint">Click again whenever you need a fresh thought.</p>
    </main>
    <script>
      const messages = [
        'Hello! A new message is just a click away.',
        'You clicked it! Small actions can make a difference.',
        'Keep exploring. There is always something new to discover.',
        'A fresh start can be as simple as one small step.'
      ];
      let messageIndex = 0;
      document.getElementById('change-message').addEventListener('click', () => {
        messageIndex = (messageIndex + 1) % messages.length;
        document.getElementById('message').textContent = messages[messageIndex];
      });
    </script>
  </body>
</html>
